<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>three-webgpu-pixel-shader</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; }
    body { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #f2ece0; }
    #stage { position: fixed; inset: 0; touch-action: none; cursor: ew-resize; }
    canvas { display: block; width: 100%; height: 100%; }
    #divider { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff8e8;
      box-shadow: 0 0 0 1px rgba(20, 16, 28, 0.35); pointer-events: none; }
    #divider::after { content: ''; position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
      margin: -9px 0 0 -9px; border: 2px solid #fff8e8; border-radius: 50%; background: #14101c; }
    .label { position: absolute; top: 12px; padding: 3px 7px; background: rgba(20, 16, 28, 0.7);
      border-radius: 3px; pointer-events: none; }
    #left { left: 12px; } #right { right: 12px; }
    #controls { position: fixed; left: 12px; bottom: 12px; display: grid; grid-template-columns: auto 110px;
      gap: 4px 10px; align-items: center; padding: 8px 10px; background: rgba(20, 16, 28, 0.8); border-radius: 4px; }
    #controls input, #controls select { width: 100%; margin: 0; }
    .auto #controls { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div id="divider"></div>
    <div class="label" id="left">Three.js</div>
    <div class="label" id="right">Pixel shader</div>
  </div>
  <div id="controls">
    <label for="pixelSize">Pixel size</label><input id="pixelSize" type="range" min="1" max="8" step="1">
    <label for="dither">Dither</label><input id="dither" type="range" min="0" max="1" step="0.05">
    <label for="outlines">Outlines</label><input id="outlines" type="range" min="0" max="1" step="0.05">
    <label for="rim">Rim</label><input id="rim" type="range" min="0" max="1" step="0.05">
    <label for="palette">Palette</label>
    <select id="palette"><option value="diorama">diorama</option><option value="none">none</option></select>
  </div>
  <script type="module" src="demo.js"></script>
</body>
</html>
